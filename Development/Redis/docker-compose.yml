name: labtechsaude

services:
  redis:
    image: maumitsuo/labtechsaude-redis:latest
    container_name: labtechsaude-redis
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - LC_ALL=pt_BR.UTF-8
      - LANG=pt_BR.UTF-8
      - LANGUAGE=pt_BR.UTF-8
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

volumes:
  redisdata: